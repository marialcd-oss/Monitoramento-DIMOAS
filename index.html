<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAL — Arquivo de Convergências</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400..900;1,400..900&family=Space+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F4F0E4;
    --cream-deep: #EAE2CC;
    --cream-line: #D9CFB0;
    --ink: #17130F;
    --ink-soft: #4A4238;
    --coral: #F25C54;
    --coral-deep: #C43F38;
    --coral-pale: #FBE3E0;
    --yellow: #F0BE1E;
    --yellow-deep: #8A6A0C;
    --yellow-pale: #FBF0CE;
    --cobalt: #2A4B9B;
    --cobalt-deep: #1D356F;
    --cobalt-pale: #E3E9F8;
    --purple: #4A2574;
    --purple-deep: #2A1454;
    --purple-line: #6B3FA0;
    --white: #FFFDF8;
    --display: 'Bodoni Moda', 'Didot', Georgia, 'Times New Roman', serif;
    --sans: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: var(--sans);
    background: var(--cream);
    color: var(--ink);
  }
  body {
    display: flex; flex-direction: column;
    background-image: radial-gradient(var(--cream-line) 1px, transparent 1.15px);
    background-size: 16px 16px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- TOP BAR ---------- */
  header.topbar {
    background: var(--purple-deep);
    border-bottom: 3px solid var(--coral);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 10;
  }
  .wordmark { display: flex; align-items: center; gap: 14px; }
  .regmark {
    width: 36px; height: 36px; border-radius: 50%;
    border: 2px solid var(--white);
    position: relative;
    flex-shrink: 0;
  }
  .regmark::before {
    content: "";
    position: absolute; top: 50%; left: 50%;
    width: 2px; height: 22px;
    background: var(--coral);
    transform: translate(-50%, -50%) rotate(35deg);
  }
  header.topbar .title {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.6px;
    line-height: 1.35;
    color: var(--white);
    text-transform: uppercase;
  }
  header.topbar .title small {
    display: block;
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 500;
    font-style: normal;
    color: var(--purple-line);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 6px;
  }
  header.topbar .actions { display: flex; gap: 10px; align-items: center; }
  .btn {
    font-family: var(--sans);
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    border: 1.5px solid var(--white);
    background: transparent;
    color: var(--white);
    padding: 8px 15px;
    border-radius: 20px;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s, color 0.15s;
  }
  .btn:hover { background: var(--coral); color: var(--white); border-color: var(--coral); transform: translateY(-1px); }
  .save-indicator {
    font-family: var(--sans);
    font-size: 10.5px; font-weight: 600; color: var(--coral); opacity: 0; transition: opacity 0.3s;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .save-indicator.show { opacity: 1; }
  .shared-note {
    font-family: var(--sans); font-size: 9.5px; font-weight: 600; letter-spacing: 0.2px;
    color: rgba(255,255,255,0.65); cursor: default; max-width: 220px;
  }

  /* ---------- SUBBAR (network + view tabs) ---------- */
  .subbar {
    background: var(--white);
    border-bottom: 2px solid var(--ink);
    padding: 10px 28px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
    flex-shrink: 0;
  }
  .subbar-group { display: flex; align-items: center; gap: 10px; }
  .subbar-label {
    font-family: var(--sans); font-size: 10px; font-weight: 700; letter-spacing: 1px;
    color: var(--ink-soft); text-transform: uppercase;
  }
  .network-select {
    font-family: var(--sans); font-size: 12.5px; font-weight: 600;
    border: 1.5px solid var(--purple); border-radius: 20px; padding: 6px 12px;
    background: var(--purple); color: var(--white); cursor: pointer;
    max-width: 320px;
  }
  .network-select option:disabled { color: #999; }
  .subbar-group.tabs { gap: 6px; }
  .tab-btn {
    font-family: var(--sans); font-size: 12.5px; font-weight: 700;
    border: 1.5px solid var(--ink); border-radius: 20px; padding: 7px 16px;
    background: var(--white); color: var(--ink); cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .tab-btn:hover { background: var(--cream); }
  .tab-btn.active { background: var(--ink); color: var(--white); }
  .tab-count {
    font-family: var(--sans); font-size: 10px; font-weight: 700;
    margin-left: 4px; opacity: 0.75;
  }

  /* ---------- LAYOUT ---------- */
  .main-wrap { flex: 1; display: flex; min-height: 0; }

  /* ---------- SIDEBAR (archive index) ---------- */
  nav.sidebar {
    width: 360px;
    flex-shrink: 0;
    background: var(--cream-deep);
    border-right: 2px solid var(--ink);
    overflow-y: auto;
    padding: 18px 0 40px;
  }
  .search-box { margin: 0 18px 18px; }
  .search-box input {
    width: 100%;
    padding: 10px 14px;
    font-size: 13px;
    font-family: var(--sans);
    border: 1.5px solid var(--ink);
    border-radius: 20px;
    background: var(--white);
    color: var(--ink);
  }
  .search-box input::placeholder { color: #A79C82; }
  .search-box input:focus { outline: none; border-color: var(--coral); box-shadow: 0 0 0 3px var(--coral-pale); }

  .instr-group { margin-bottom: 2px; }
  .instr-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 15px 18px;
    cursor: pointer;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--white);
    background: var(--purple);
    position: sticky;
    top: 0;
    border-top: 1px solid var(--purple-line);
    border-bottom: 2px solid var(--purple-deep);
    z-index: 2;
  }
  .instr-header .idx { color: var(--coral); font-family: var(--display); font-style: italic; margin-right: 8px; font-size: 15px; }
  .instr-header .count {
    font-family: var(--sans);
    font-weight: 500;
    font-size: 12px;
    color: var(--purple-line);
  }
  .instr-header .chevron { transition: transform 0.15s; font-size: 11px; margin-left: 6px; color: var(--white); }
  .instr-group.collapsed .chevron { transform: rotate(-90deg); }
  .instr-group.collapsed .indic-list { display: none; }

  .indic-list { list-style: none; margin: 0; padding: 0; }
  .indic-item {
    padding: 10px 18px 10px 22px;
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--ink-soft);
    cursor: pointer;
    border-bottom: 1px solid var(--cream-line);
    transition: transform 0.12s, background 0.12s;
    position: relative;
  }
  .indic-item:hover { background: var(--white); transform: translateX(3px); }
  .indic-item.active {
    background: var(--white);
    color: var(--ink);
    font-weight: 600;
    border-left: 4px solid var(--coral);
    padding-left: 18px;
  }
  .indic-item .n-edges {
    display: inline-block;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 700;
    color: var(--white);
    background: var(--cobalt);
    border-radius: 8px;
    padding: 1px 7px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .indic-item.active .n-edges { background: var(--coral); }
  .no-results { padding: 20px 18px; font-size: 12.5px; color: var(--ink-soft); font-style: italic; font-family: var(--display); }

  /* ---------- MAIN CONTENT ---------- */
  main.content {
    flex: 1;
    overflow-y: auto;
    padding: 40px 48px 100px;
    max-width: 1140px;
  }
  .empty-state {
    color: var(--ink-soft);
    font-family: var(--display);
    font-style: italic;
    font-size: 20px;
    padding-top: 110px;
    text-align: center;
  }

  .card-header { margin-bottom: 28px; position: relative; }
  .badges { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .ticket-no {
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.8px;
    color: var(--ink-soft);
  }
  .badge-instr {
    display: inline-block;
    font-family: var(--sans);
    background: var(--ink);
    color: var(--cream);
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 20px;
    letter-spacing: 0.8px;
  }
  .badge-tema {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    color: var(--yellow-deep);
    background: var(--yellow-pale);
    border: 1px solid var(--yellow);
    padding: 4px 11px;
    border-radius: 20px;
    transform: rotate(-1.2deg);
    display: inline-block;
  }
  .badge-tema[contenteditable="true"] { cursor: text; }
  .lacuna-flag {
    display: inline-block;
    font-family: var(--sans); font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
    color: var(--coral-deep); background: var(--coral-pale); border: 1px solid var(--coral);
    padding: 4px 11px; border-radius: 20px;
  }
  .lacuna-result-box {
    border: 2px solid var(--ink); border-radius: 4px; background: var(--white);
    padding: 16px 20px; margin: 24px 0;
  }
  h1.indic-name {
    font-family: var(--display);
    font-style: italic;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.25;
    margin: 0;
    color: var(--ink);
    outline: none;
    letter-spacing: -0.1px;
  }
  h1.indic-name[contenteditable="true"]:focus {
    background: var(--white);
    box-shadow: 0 0 0 3px var(--coral-pale);
    border-radius: 3px;
  }

  /* ---------- GRAPH PANEL ---------- */
  .graph-wrap {
    margin: 30px 0 10px;
    border: 2px solid var(--ink);
    border-radius: 2px;
    background: var(--white);
    overflow: visible;
    position: relative;
  }
  .graph-wrap .regcircle {
    position: absolute;
    width: 16px; height: 16px;
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    background: var(--cream);
    z-index: 3;
  }
  .graph-wrap .regcircle::before, .graph-wrap .regcircle::after {
    content: ""; position: absolute; background: var(--ink);
  }
  .graph-wrap .regcircle::before { top: 50%; left: 2px; right: 2px; height: 1px; transform: translateY(-50%); }
  .graph-wrap .regcircle::after { left: 50%; top: 2px; bottom: 2px; width: 1px; transform: translateX(-50%); }
  .graph-wrap .regcircle.tl { top: -8px; left: -8px; }
  .graph-wrap .regcircle.tr { top: -8px; right: -8px; }
  .graph-wrap .regcircle.bl { bottom: -8px; left: -8px; }
  .graph-wrap .regcircle.br { bottom: -8px; right: -8px; }

  .legend {
    display: flex; gap: 18px; align-items: center;
    padding: 12px 22px;
    border-top: 2px solid var(--ink);
    background: var(--cream-deep);
    font-family: var(--sans);
    font-size: 10.5px; font-weight: 500; color: var(--ink-soft);
    flex-wrap: wrap;
  }
  .legend .item { display: flex; align-items: center; gap: 7px; }
  .legend .swatch { width: 22px; height: 0; border-top: 3px solid; display: inline-block; }

  /* ---------- EDGE CARDS (index cards) ---------- */
  .edges-list { margin-top: 30px; display: flex; flex-direction: column; gap: 16px; }
  .edge-card {
    border: 1.5px solid var(--ink);
    border-radius: 2px;
    background: var(--white);
    padding: 16px 20px;
    position: relative;
    opacity: 0;
    animation: riseIn 0.32s ease-out forwards;
  }
  .edge-card::before {
    content: attr(data-tag);
    position: absolute;
    top: -10px; left: 16px;
    font-family: var(--sans);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 2px 9px;
    border-radius: 20px;
    color: var(--white);
    transform: rotate(-2deg);
  }
  .edge-card.tipo-metodologica::before { background: var(--cobalt); content: "Metodológica"; }
  .edge-card.tipo-tematica::before { background: var(--coral); content: "Temática / Causal"; }
  .edge-card.tipo-hipotese::before { background: var(--yellow-deep); content: "Hipótese"; }
  .edge-card.tipo-naoidentificada::before { background: var(--ink-soft); content: "Não identificada"; }

  .edge-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; margin-bottom: 9px; margin-top: 6px; flex-wrap: wrap;
  }  .edge-partner {
    font-family: var(--display);
    font-style: italic;
    font-weight: 700;
    font-size: 16px;
    color: var(--ink);
    outline: none;
  }
  .edge-partner[contenteditable="true"]:focus {
    background: var(--cream); box-shadow: 0 0 0 3px var(--coral-pale); border-radius: 3px;
  }
  .edge-partner-instr {
    font-family: var(--sans);
    font-size: 10px; font-weight: 700; color: var(--cobalt-deep);
    background: var(--cobalt-pale);
    padding: 2px 8px; border-radius: 20px;
    white-space: nowrap;
    letter-spacing: 0.3px;
  }
  select.tipo-select {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    border: 1.5px solid var(--ink);
    border-radius: 20px;
    padding: 4px 10px;
    background: var(--cream);
    color: var(--ink);
    cursor: pointer;
  }
  .edge-razao {
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--ink-soft);
    outline: none;
    min-height: 20px;
  }
  .edge-razao:empty::before {
    content: "Aguardando sua análise — clique aqui para escrever.";
    font-style: italic;
    color: #A79C82;
  }
  .edge-razao[contenteditable="true"]:focus {
    background: var(--cream); box-shadow: 0 0 0 3px var(--coral-pale); border-radius: 3px; padding: 3px 5px;
  }
  .shared-terms { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .term-chip {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    background: var(--yellow-pale);
    border: 1px solid var(--yellow);
    color: var(--yellow-deep);
    padding: 2px 9px;
    border-radius: 20px;
  }

  .report-btn {    margin-top: 12px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--cobalt-deep);
    background: var(--cobalt-pale);
    border: 1.5px solid var(--cobalt);
    border-radius: 20px;
    padding: 7px 14px;
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
  }
  .report-btn:hover { background: var(--cobalt); color: var(--white); transform: translateY(-1px); }

  .result-strip {
    display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .result-strip-item {
    flex: 1; min-width: 220px;
    background: var(--cream);
    border: 1px solid var(--cream-line);
    border-radius: 4px;
    padding: 8px 12px;
  }
  .rs-label {
    display: block;
    font-family: var(--sans); font-size: 9px; font-weight: 700; letter-spacing: 0.8px;
    color: var(--ink-soft); margin-bottom: 3px;
  }
  .rs-value {
    font-family: var(--sans); font-size: 12px; font-weight: 600;
  }
  .rs-chipwrap { display: flex; flex-wrap: wrap; gap: 5px; }
  .rs-empty { font-family: var(--sans); font-size: 11.5px; font-style: italic; color: var(--ink-soft); }
  .rs-chip {
    font-family: var(--sans); font-size: 10.5px; font-weight: 600;
    padding: 3px 9px; border-radius: 12px; cursor: default;
    border: 1px solid transparent;
  }
  .rs-chip-ok { background: var(--cobalt-pale); color: var(--cobalt-deep); border-color: var(--cobalt); }
  .rs-chip-bad { background: var(--coral-pale); color: var(--coral-deep); border-color: var(--coral); }
  .rs-chip-neutral { background: var(--yellow-pale); color: var(--yellow-deep); border-color: var(--yellow); }

  /* ---------- PERIODICIDADE (quadrimestral x anual) ---------- */
  .periodicidade-tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--sans); font-size: 9px; font-weight: 700; letter-spacing: 0.4px;
    padding: 2px 8px; border-radius: 10px; margin-top: 4px; text-transform: uppercase;
  }
  .periodicidade-tag.pt-quad { background: var(--cobalt-pale); color: var(--cobalt-deep); border: 1px solid var(--cobalt); }
  .periodicidade-tag.pt-anual { background: var(--yellow-pale); color: var(--yellow-deep); border: 1px solid var(--yellow); }
  .periodicidade-tag.pt-indef { background: var(--cream); color: var(--ink-soft); border: 1px solid var(--cream-line); }

  .periodicidade-alert {
    font-family: var(--sans); font-size: 12px; line-height: 1.5;
    border-radius: 4px; padding: 10px 12px; margin: 8px 0 4px;
  }
  .periodicidade-alert strong { font-weight: 700; }
  .periodicidade-alert.periodicidade-cautela {
    background: var(--yellow-pale); border: 1px solid var(--yellow); color: #5C4708;
  }
  .periodicidade-alert.periodicidade-consolidado {
    background: var(--coral-pale); border: 1.5px solid var(--coral-deep); color: var(--coral-deep);
  }

  .loading-overlay {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(23,19,15,0.55);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--sans); font-size: 13px; font-weight: 700; letter-spacing: 0.4px;
    color: var(--white);
  }
  .loading-overlay::before {
    content: ""; display: inline-block; width: 14px; height: 14px; margin-right: 10px;
    border: 2.5px solid rgba(255,255,255,0.35); border-top-color: var(--coral);
    border-radius: 50%; animation: loadspin 0.8s linear infinite;
  }
  @keyframes loadspin { to { transform: rotate(360deg); } }
  .planning-loading { font-family: var(--sans); font-size: 12px; font-style: italic; color: var(--ink-soft); padding: 6px 0; }

  .tendencia-box {
    font-family: var(--sans); font-size: 12px; line-height: 1.5;
    border-radius: 4px; padding: 10px 12px; margin: 8px 0 4px;
  }
  .tendencia-box strong { font-weight: 700; }
  .tendencia-box.tend-alerta { background: var(--coral-pale); border: 1.5px solid var(--coral-deep); color: var(--coral-deep); }
  .tendencia-box.tend-recuperacao { background: var(--yellow-pale); border: 1px solid var(--yellow); color: #5C4708; }
  .tendencia-box.tend-ok { background: var(--cobalt-pale); border: 1px solid var(--cobalt); color: var(--cobalt-deep); }

  .alert-dot-trend { color: var(--coral-deep); font-size: 9px; vertical-align: 2px; margin-right: 2px; }
  .alert-dot { color: var(--coral-deep); font-size: 10px; vertical-align: 1px; margin-right: 2px; }
  .alert-dot-yellow { color: var(--yellow-deep); font-size: 10px; vertical-align: 1px; margin-right: 2px; }

  /* ---------- REPORT MODAL ---------- */
  .report-overlay {
    position: fixed; inset: 0;
    background: rgba(23,19,15,0.55);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 30px;
    animation: fadeIn 0.18s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .report-modal {
    background: var(--cream);
    border: 2px solid var(--ink);
    border-radius: 4px;
    max-width: 880px; width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 8px 8px 0 var(--coral);
    animation: riseIn 0.22s ease-out;
  }
  .report-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 22px 26px 16px;
    border-bottom: 2px solid var(--ink);
    background: var(--cream-deep);
  }
  .report-kicker {
    font-family: var(--sans); font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--ink-soft); margin-bottom: 8px;
  }
  .report-tipo-tag {
    display: inline-block;
    font-family: var(--sans); font-size: 12px; font-weight: 700;
    padding: 5px 13px; border-radius: 20px; color: var(--white);
  }
  .report-tipo-tag.tipo-metodologica { background: var(--cobalt); }
  .report-tipo-tag.tipo-tematica { background: var(--coral); }
  .report-tipo-tag.tipo-hipotese { background: var(--yellow-deep); }

      try { await window.storage.set(key, value, shared); return true; }
      catch (e) { console.error("storage set failed", key, e); return false; }
    }
    try { localStorage.setItem(key, value); return true; }
    catch (e) { console.error("localStorage set failed", key, e); return false; }
  }
  async function storageDelete(key, shared) {
    if (STORAGE_BACKEND === "artifact") {
      try { await window.storage.delete(key, shared); return true; }
      catch (e) { return false; }
    }
    try { localStorage.removeItem(key); return true; } catch (e) { return false; }
  }
  async function storageList(prefix, shared) {
    if (STORAGE_BACKEND === "artifact") {
      try {
        const res = await window.storage.list(prefix, shared);
        return (res && res.keys) || [];
      } catch (e) { return []; }
    }
    try {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf(prefix) === 0) keys.push(k);
      }
      return keys;
    } catch (e) { return []; }
  }
  function hashStr(s) {
    let h = 5381;
    for (let i = 0; i < s.length; i++) { h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; }
    return h.toString(36);
  }
  const PLAN_FILE_MAX_BYTES = STORAGE_BACKEND === "artifact" ? 3 * 1024 * 1024 : 1.5 * 1024 * 1024;
  const PLAN_FILE_MAX_LABEL = STORAGE_BACKEND === "artifact" ? "3MB" : "1,5MB";

    coralDeep: "#C43F38",
    cobalt: "#2A4B9B",
    yellow: "#8A6A0C",
    line: "#D9CFB0",
  };

  function tipoClass(tipo) {
    if (tipo.startsWith("Metodológica")) return "tipo-metodologica";
    if (tipo === "Temática/Causal") return "tipo-tematica";
    if (tipo.startsWith("Temática")) return "tipo-hipotese";
    return "tipo-naoidentificada";
  }
  function tipoLabel(tipo) {
    if (tipo.startsWith("Metodológica")) return "Convergência Metodológica";
    if (tipo === "Temática/Causal") return "Convergência Temática / Causal";
    if (tipo.startsWith("Temática")) return "Hipótese (sem ficha para checar)";
    return "Base não identificada";
  }
  function tipoStroke(tipo) {
    if (tipo.startsWith("Metodológica")) return COLORS.cobalt;
    if (tipo === "Temática/Causal") return COLORS.coral;
    if (tipo.startsWith("Temática")) return COLORS.yellow;
    return COLORS.line;
  }
  function tipoDash(tipo) {
    if (tipo.startsWith("Metodológica")) return "0";
    if (tipo.startsWith("Temática")) return "7,5";
    return "1,4";
  }
  const TIPO_OPTIONS = [

  function cardHasConsolidatedAlert(card) {
    const check = (resultado) => {
      if (!resultado || !resultado.registros) return false;
      const info = periodicidadeInfo(resultado);
      if (!info || info.cautela) return false;
      return resultado.registros.some((r) => isSituacaoRuim(r.situacao));

    if (check(card.resultado)) return true;
    return (card.edges || []).some((e) => check(e.resultado));
  }

  // ---------- PLANNING INSTRUMENT (file / link attachment PER UNIT) ----------
  // Cada anexo vira uma chave própria no armazenamento compartilhado (não um blob único),
  // pois chaves aceitam no máx. 200 caracteres e não podem ter espaços/aspas/barras —
  // o nome do indicador não serve como chave diretamente, por isso usamos um hash.
  let planKeysCache = new Set();

  async function refreshPlanKeysCache() {
    const keys = await storageList(`plan_${currentNetwork}_`, true);
    planKeysCache = new Set(keys || []);
  }

  function planKey(card, unitName) {
    // A chave NÃO pode depender de campos editáveis (como o nome do indicador,
    // que é contentEditable): se o texto mudasse, o link do anexo mudaria junto,
    // e o anexo "sumiria" da tela para quem reabrisse o link depois. Por isso usamos
    // a posição do indicador no array (estável) + o instrumento, não o nome.
    let idx = cards ? cards.indexOf(card) : -1;
    let bucket = "c";
    if (idx === -1 && lacunas) { idx = lacunas.indexOf(card); bucket = "l"; }
    const raw = bucket + idx + "|" + (card.instrumento || "") + "|" + (unitName || "");
    return `plan_${currentNetwork}_${hashStr(raw)}`;
  }

  function collectAllUnits(card) {
    const map = new Map(); // name -> situação (last seen)
    const scan = (resultado) => {
      if (resultado && resultado.nivel === "regional") {
        resultado.registros.forEach((r) => {
          if (r.local) map.set(String(r.local), r.situacao || null);
        });
      }
    };
    scan(card.resultado);
    card.edges.forEach((e) => scan(e.resultado));
    return Array.from(map.entries()).map(([name, situacao]) => ({ name, situacao })).sort((a, b) => a.name.localeCompare(b.name, "pt-BR"));
  }

  function buildPlanningSlot(card, unitName, unitSituacao) {
    const key = planKey(card, unitName);
    const slot = document.createElement("div");
    slot.className = "planning-slot";
    slot.innerHTML = `<div class="planning-loading">Carregando…</div>`;

    async function render() {
      const raw = await storageGet(key, true);
      let saved = null;
      if (raw) { try { saved = JSON.parse(raw); } catch (e) { /* ignore */ } }
      slot.innerHTML = "";

      if (saved && (saved.filename || saved.link)) {
        const box = document.createElement("div");
        box.className = "planning-saved";
        if (saved.filename) {
          const fileRow = document.createElement("div");
          fileRow.className = "planning-row";
          fileRow.innerHTML = `<span class="planning-icon">📎</span> <span class="planning-filename"></span>`;
          fileRow.querySelector(".planning-filename").textContent = saved.filename;
          const dlBtn = document.createElement("button");
          dlBtn.className = "btn-mini";
          dlBtn.textContent = "Baixar";
          dlBtn.addEventListener("click", () => {
            const a = document.createElement("a");
            a.href = saved.dataUrl;
            a.download = saved.filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          });
          fileRow.appendChild(dlBtn);
          box.appendChild(fileRow);
        }
        if (saved.link) {
          const linkRow = document.createElement("div");
          linkRow.className = "planning-row";
          linkRow.innerHTML = `<span class="planning-icon">🔗</span> <a class="planning-link" target="_blank" rel="noopener"></a>`;
          const a = linkRow.querySelector(".planning-link");
          a.href = saved.link; a.textContent = saved.link;
          box.appendChild(linkRow);
        }
        const removeBtn = document.createElement("button");
        removeBtn.className = "btn-mini btn-mini-danger";
        removeBtn.textContent = "Remover";
        removeBtn.addEventListener("click", async () => {
          removeBtn.disabled = true;
          await storageDelete(key, true);
          planKeysCache.delete(key);
          render();
        });
        box.appendChild(removeBtn);
        slot.appendChild(box);
      } else {
        const form = document.createElement("div");
        form.className = "planning-form";

        const uid = "planningFile_" + Math.random().toString(36).slice(2);
        const fileInput = document.createElement("input");
        fileInput.type = "file";
        fileInput.className = "planning-file-input";
        fileInput.id = uid;

        const fileLabel = document.createElement("label");
        fileLabel.className = "btn-mini";
        fileLabel.htmlFor = uid;
        fileLabel.textContent = "Escolher arquivo…";
        const fileNameSpan = document.createElement("span");
        fileNameSpan.className = "planning-filename-preview";
        fileNameSpan.textContent = "Nenhum arquivo selecionado";
        fileInput.addEventListener("change", () => {
          fileNameSpan.textContent = fileInput.files[0] ? fileInput.files[0].name : "Nenhum arquivo selecionado";
        });

        const linkInput = document.createElement("input");
        linkInput.type = "text";
        linkInput.className = "planning-link-input";
        linkInput.placeholder = "ou cole um link (ex.: documento compartilhado)…";

        const saveBtn = document.createElement("button");
        saveBtn.className = "btn-mini btn-mini-primary";
        saveBtn.textContent = "Salvar";
        saveBtn.addEventListener("click", () => {
          const file = fileInput.files[0];
          const link = linkInput.value.trim();
          if (!file && !link) { alert("Escolha um arquivo ou cole um link."); return; }
          const finish = async (dataUrl) => {
            saveBtn.disabled = true;
            saveBtn.textContent = "Salvando…";
            const planData = {
              filename: file ? file.name : null,
              dataUrl: dataUrl || null,
              link: link || null,
              updatedAt: new Date().toISOString(),
            };
            const ok = await storageSet(key, JSON.stringify(planData), true);
            if (ok) {
              planKeysCache.add(key);
              render();
            } else {
              saveBtn.disabled = false;
              saveBtn.textContent = "Salvar";
              alert("Não foi possível salvar agora. Tente novamente ou use um link em vez do arquivo.");
            }
          };
          if (file) {
            if (file.size > PLAN_FILE_MAX_BYTES) {
              alert(`Arquivo maior que ${PLAN_FILE_MAX_LABEL} — use um link em vez de anexar o arquivo diretamente (ex.: link do Google Drive/SEI).`);
              return;
            }
            const reader = new FileReader();
            reader.onload = () => finish(reader.result);
            reader.readAsDataURL(file);
          } else {
            finish(null);
          }
        });

        const fileRow = document.createElement("div");
        fileRow.className = "planning-row";
        fileRow.appendChild(fileInput);
        fileRow.appendChild(fileLabel);
        fileRow.appendChild(fileNameSpan);

        const linkRow = document.createElement("div");
        linkRow.className = "planning-row";
        linkRow.appendChild(linkInput);

        form.appendChild(fileRow);
        form.appendChild(linkRow);
        form.appendChild(saveBtn);
        slot.appendChild(form);
      }
    }
    render();
    return slot;
  }

  function buildPlanningSection(card) {
    const wrap = document.createElement("div");
    wrap.className = "planning-section";

    const title = document.createElement("div");
    title.className = "planning-title";
    title.textContent = "Instrumento de Planejamento";
    wrap.appendChild(title);

    const desc = document.createElement("div");
    desc.className = "planning-desc";
    desc.textContent = "Anexe o plano de ação ou outro instrumento de planejamento — por unidade — útil para consultar, quando pertinente, por que uma região, hospital ou policlínica específica não atingiu a meta.";
    wrap.appendChild(desc);

    const units = collectAllUnits(card);

    if (!units.length) {
      // no per-unit breakdown available (e.g. indicator and all correlations are distrital) — single general slot
      const generalLabel = document.createElement("div");
      generalLabel.className = "planning-unit-label";
      generalLabel.textContent = "Geral (indicador distrital, sem desagregação por unidade)";
      wrap.appendChild(generalLabel);
      wrap.appendChild(buildPlanningSlot(card, null, null));
      return wrap;
    }

    units.forEach((u) => {
      const details = document.createElement("details");
      details.className = "planning-unit";
      const summary = document.createElement("summary");
      const nameSpan = document.createElement("span");
      nameSpan.className = "planning-unit-name";
      nameSpan.textContent = u.name;
      summary.appendChild(nameSpan);
      if (u.situacao) {
        const badge = document.createElement("span");
        const cls = u.situacao.includes("Atingiu") ? "rs-chip rs-chip-ok" : (u.situacao.includes("Não") ? "rs-chip rs-chip-bad" : "rs-chip rs-chip-neutral");
        badge.className = cls;
        badge.style.marginLeft = "10px";
        badge.textContent = u.situacao;
        summary.appendChild(badge);
      }
      if (planKeysCache.has(planKey(card, u.name))) {
        const dot = document.createElement("span");
        dot.className = "planning-has-file-dot";
        dot.title = "Tem instrumento anexado";
        summary.appendChild(dot);
      }
      details.appendChild(summary);
      details.appendChild(buildPlanningSlot(card, u.name, u.situacao));
      wrap.appendChild(details);
    });

    return wrap;
  }


  function buildResultChips(resultado) {
    const wrap = document.createElement("div");
    wrap.className = "rs-chipwrap";
    if (!resultado || !resultado.registros || !resultado.registros.length) {
      const span = document.createElement("span");
      span.className = "rs-empty";
      span.textContent = "Sem resultado localizado";
      wrap.appendChild(span);
      return wrap;
    }
    if (resultado.nivel === "distrital") {
      const r = resultado.registros[0];
      const sit = r.situacao || "—";
      const span = document.createElement("span");
      span.className = "rs-value";
      span.style.color = situacaoColor(sit);
      span.textContent = `Meta ${fmtNum(r.meta)} · Resultado ${fmtNum(r.resultado)} · ${sit}`;
      wrap.appendChild(span);
      const tagWrap = document.createElement("div");
      tagWrap.innerHTML = periodicidadeTagHTML(resultado);
      wrap.appendChild(tagWrap.firstChild);
      return wrap;
    }
    // regional/unidade: show each unit name as a chip, colored by situação
    resultado.registros.forEach((r) => {
      const chip = document.createElement("span");
      const sit = (r.situacao || "");
      const cls = sit.includes("Atingiu") ? "rs-chip rs-chip-ok" : (sit.includes("Não") ? "rs-chip rs-chip-bad" : "rs-chip rs-chip-neutral");
      chip.className = cls;
      chip.textContent = r.local || "—";
      chip.title = `${r.local}: Meta ${fmtNum(r.meta)} · Resultado ${fmtNum(r.resultado)} · ${sit || "—"}`;
      wrap.appendChild(chip);
    });
    const tagWrap = document.createElement("div");
    tagWrap.style.width = "100%";
    tagWrap.innerHTML = periodicidadeTagHTML(resultado);
    wrap.appendChild(tagWrap.firstChild);
    return wrap;
  }

  function buildResultSummaryStrip(card, edge) {
    const strip = document.createElement("div");
    strip.className = "result-strip";

    const c1 = document.createElement("div");
    c1.className = "result-strip-item";
    const c1label = document.createElement("span");
    c1label.className = "rs-label";
    c1label.textContent = "CENTRAL";
    c1.appendChild(c1label);
    c1.appendChild(buildResultChips(card.resultado));
    const c1alert = buildPeriodicidadeAlertEl(card.resultado);
    if (c1alert) c1.appendChild(c1alert);
    const c1trend = buildTendenciaEl(pickWorstTendencia(card.resultado), { compact: true });
    if (c1trend) c1.appendChild(c1trend);

    const c2 = document.createElement("div");
    c2.className = "result-strip-item";
    const c2label = document.createElement("span");
    c2label.className = "rs-label";
    c2label.textContent = "CORRELATO";
    c2.appendChild(c2label);
    c2.appendChild(buildResultChips(edge.resultado));
    const c2alert = buildPeriodicidadeAlertEl(edge.resultado);
    if (c2alert) c2.appendChild(c2alert);
    const c2trend = buildTendenciaEl(pickWorstTendencia(edge.resultado), { compact: true });
    if (c2trend) c2.appendChild(c2trend);

    strip.appendChild(c1);
    strip.appendChild(c2);
    return strip;
  }

  function buildEdgeCard(card, edge, ei) {
    const div = document.createElement("div");
    div.className = "edge-card " + tipoClass(edge.tipo);
    div.style.animationDelay = (ei * 45) + "ms";

    const head = document.createElement("div");
    head.className = "edge-head";

    const left = document.createElement("div");
    left.style.display = "flex";
    left.style.alignItems = "baseline";
    left.style.gap = "8px";
    left.style.flexWrap = "wrap";
    const instrSpan = document.createElement("span");
    instrSpan.className = "edge-partner-instr";
    instrSpan.textContent = edge.partner_instr;
    const nameSpan = document.createElement("span");
    nameSpan.className = "edge-partner";
    nameSpan.contentEditable = "true";
    nameSpan.spellcheck = false;
    nameSpan.textContent = edge.partner_nome;
    nameSpan.addEventListener("input", (e) => {
      edge.partner_nome = e.target.textContent;
      saveStateDebounced();
    });
    left.appendChild(instrSpan);
    left.appendChild(nameSpan);

    const select = document.createElement("select");
    select.className = "tipo-select";
    TIPO_OPTIONS.forEach((opt) => {
      const o = document.createElement("option");
      o.value = opt;
      o.textContent = opt.toUpperCase();
      if (opt === edge.tipo) o.selected = true;
      select.appendChild(o);
    });
    select.addEventListener("change", (e) => {
      edge.tipo = e.target.value;
      div.className = "edge-card " + tipoClass(edge.tipo);
      renderContent(); // re-render to update graph colors too
      saveState();
    });

    head.appendChild(left);
    head.appendChild(select);
    div.appendChild(head);

    div.appendChild(buildResultSummaryStrip(card, edge));

    const razao = document.createElement("div");
    razao.className = "edge-razao";
    razao.contentEditable = "true";
    razao.spellcheck = false;
    razao.textContent = edge.razao;
    razao.addEventListener("input", (e) => {
      edge.razao = e.target.textContent;
      saveStateDebounced();
    });
    div.appendChild(razao);

    const reportBtn = document.createElement("button");
    reportBtn.className = "report-btn";
    reportBtn.textContent = "📄 Relatório detalhado dos indicadores";
    reportBtn.addEventListener("click", () => openReport(card, edge));
    div.appendChild(reportBtn);

    if (edge.shared_terms && edge.shared_terms.length) {
      const chips = document.createElement("div");
      chips.className = "shared-terms";
      edge.shared_terms.forEach((t) => {
        const chip = document.createElement("span");
        chip.className = "term-chip";
        chip.textContent = t;
        chips.appendChild(chip);
      });
      div.appendChild(chips);
    }

    return div;
  }

  // ---------- SVG GRAPH ----------
  function buildSVG(card) {
    const n = card.edges.length;
    const width = 1080;
    const rowH = Math.max(80, Math.min(130, 560 / n));
    const height = Math.max(260, n * rowH + 40);

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.setAttribute("width", "100%");
    svg.style.display = "block";

    // graph-paper background inside the panel
    const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
    const pattern = document.createElementNS("http://www.w3.org/2000/svg", "pattern");
    pattern.setAttribute("id", "graphgrid");
    pattern.setAttribute("width", "24");
    pattern.setAttribute("height", "24");
    pattern.setAttribute("patternUnits", "userSpaceOnUse");
    const pPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
    pPath.setAttribute("d", "M 24 0 L 0 0 0 24");
    pPath.setAttribute("fill", "none");
    pPath.setAttribute("stroke", "#EBE0C4");
    pPath.setAttribute("stroke-width", "1");
    pattern.appendChild(pPath);
    defs.appendChild(pattern);
    svg.appendChild(defs);
    const bgRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    bgRect.setAttribute("x", "0"); bgRect.setAttribute("y", "0");
    bgRect.setAttribute("width", width); bgRect.setAttribute("height", height);
    bgRect.setAttribute("fill", "url(#graphgrid)");
    svg.appendChild(bgRect);

    const cx = 60, cy = height / 2;
    const centralLines = wrapSvgText(card.nome, 30).slice(0, 6);
    const cw = 350, ch = Math.max(80, 32 + centralLines.length * 24);
    const satX = 550, satW = 480;

    // edges (lines) first
    card.edges.forEach((edge, i) => {
      const ny = 30 + rowH * i + rowH / 2;
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", cx + cw);
      line.setAttribute("y1", cy);
      line.setAttribute("x2", satX);
      line.setAttribute("y2", ny);
      line.setAttribute("stroke", tipoStroke(edge.tipo));
      line.setAttribute("stroke-width", "2.5");
      line.setAttribute("stroke-dasharray", tipoDash(edge.tipo));
      svg.appendChild(line);
    });

    // central node
    const centralG = document.createElementNS("http://www.w3.org/2000/svg", "g");
    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", cx); rect.setAttribute("y", cy - ch / 2);
    rect.setAttribute("width", cw); rect.setAttribute("height", ch);
    rect.setAttribute("rx", 4);
    rect.setAttribute("fill", "#B497D6");
    rect.setAttribute("stroke", "#4A2574");
    rect.setAttribute("stroke-width", "2.5");
    centralG.appendChild(rect);
    const tagT = document.createElementNS("http://www.w3.org/2000/svg", "text");
    tagT.setAttribute("x", cx + cw / 2); tagT.setAttribute("y", cy - ch / 2 + 22);
    tagT.setAttribute("text-anchor", "middle");
    tagT.setAttribute("fill", "#F0BE1E");
    tagT.setAttribute("font-family", "'Space Grotesk', sans-serif");
    tagT.setAttribute("font-weight", "700");
    tagT.setAttribute("font-size", "11");
    tagT.setAttribute("letter-spacing", "1.4");
    tagT.textContent = "INDICADOR CENTRAL";
    centralG.appendChild(tagT);
    centralLines.forEach((line, li) => {
      const t1 = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t1.setAttribute("x", cx + cw / 2);
      t1.setAttribute("y", cy - ch / 2 + 44 + li * 24);
      t1.setAttribute("text-anchor", "middle");
      t1.setAttribute("fill", "#F0BE1E");
      t1.setAttribute("font-family", "'Bodoni Moda', Georgia, serif");
      t1.setAttribute("font-style", "italic");
      t1.setAttribute("font-weight", "700");
      t1.setAttribute("font-size", "17");
      t1.textContent = line;
      centralG.appendChild(t1);
    });
    svg.appendChild(centralG);

    // satellite nodes
    card.edges.forEach((edge, i) => {
      const ny = 30 + rowH * i + rowH / 2;
      const nh = Math.min(rowH - 16, 96);
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      r.setAttribute("x", satX); r.setAttribute("y", ny - nh / 2);
      r.setAttribute("width", satW); r.setAttribute("height", nh);
      r.setAttribute("rx", 4);
      r.setAttribute("fill", "#FFFFFF");
      r.setAttribute("stroke", COLORS.coralDeep);
      r.setAttribute("stroke-width", "1.8");
      g.appendChild(r);

      const tag = document.createElementNS("http://www.w3.org/2000/svg", "text");
      tag.setAttribute("x", satX + 16); tag.setAttribute("y", ny - nh / 2 + 24);
      tag.setAttribute("fill", COLORS.cobalt);
      tag.setAttribute("font-family", "'Space Grotesk', sans-serif");
      tag.setAttribute("font-weight", "700");
      tag.setAttribute("font-size", "12.5");
      tag.textContent = `[${edge.partner_instr}]`;
      g.appendChild(tag);

      const nameLines = wrapSvgText(edge.partner_nome, 56);
      nameLines.slice(0, nh > 70 ? 3 : 2).forEach((line, li) => {
        const tx = document.createElementNS("http://www.w3.org/2000/svg", "text");
        tx.setAttribute("x", satX + 16);
        tx.setAttribute("y", ny - nh / 2 + 46 + li * 19);
        tx.setAttribute("fill", "#201A33");
        tx.setAttribute("font-family", "'Bodoni Moda', Georgia, serif"); tx.setAttribute("font-style", "italic");
        tx.setAttribute("font-size", "14.5");
        tx.textContent = line;
        g.appendChild(tx);
      });

      svg.appendChild(g);
    });

    return svg;
  }

  function wrapSvgText(text, maxChars) {
    const words = text.split(" ");
    const lines = [];
    let cur = "";
    words.forEach((w) => {
      if ((cur + " " + w).trim().length > maxChars) {
        lines.push(cur.trim());
        cur = w;
      } else {
        cur += " " + w;
      }
    });
    if (cur.trim()) lines.push(cur.trim());
    return lines;
  }

  // ---------- RESULT FORMATTING ----------
  function fmtNum(v) {
    if (v === null || v === undefined) return "—";
    if (typeof v === "string") return v;
    if (Math.abs(v) <= 3 && v !== Math.round(v)) {
      // treat as percentage fraction (e.g. 0.7643)
      return (v * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "%";
    }
    return v.toLocaleString("pt-BR", { maximumFractionDigits: 2 });
  }

  function situacaoColor(sit) {
    if (!sit) return "var(--ink-soft)";
    const s = sit.toLowerCase();
    if (s.includes("não atingiu") || s.includes("insuficiente")) return "var(--coral-deep)";
    if (s.includes("atingiu") || s.includes("ótimo") || s.includes("bom")) return "var(--cobalt-deep)";
    return "var(--yellow-deep)";
  }

  // ---------- PERIODICIDADE (quadrimestral x anual) ----------
  // Classificação derivada do campo "Acumulativo" das planilhas-fonte (Indicadores_REGIAO,
  // Indicadores_AGL_Hospitalar, Indicadores_URDs, AGL_SECUNDÁRIA):
  //  - anual_cumulativo / anual_indefinido: a meta é avaliada no "Resultado parcial/Anual" —
  //    o resultado exibido é um recorte parcial do ano em curso, sujeito a mudar até dezembro.
  //  - quadrimestral_consolidado: cálculo mês a mês / não acumulado — o resultado do período
  //    já reflete o desempenho real daquele quadrimestre, não é diluído pelos meses seguintes.
  //  - indefinido / sem_match: o indicador não foi localizado nas planilhas de origem com o
  //    campo "Acumulativo" preenchido; tratado por padrão como anual (postura cautelosa).
  function isSituacaoRuim(sit) {
    if (!sit) return false;
    const s = sit.toLowerCase();
    return s.includes("não atingiu") || s.includes("insuficiente") || s.includes("crítico") || s.includes("critico");
  }

  function periodicidadeInfo(resultado) {
    if (!resultado) return null;
    const classe = resultado.periodicidade || "sem_match";
    const cautela = resultado.periodicidade_cautela !== undefined ? resultado.periodicidade_cautela : true;
    const label = resultado.periodicidade_label || "Periodicidade não identificada na fonte";
    const badgeClass = classe.startsWith("quad") ? "pt-quad" : (classe === "indefinido" || classe === "sem_match" ? "pt-indef" : "pt-anual");
    return { classe, cautela, label, badgeClass };
  }

  function periodicidadeTagHTML(resultado) {
    const info = periodicidadeInfo(resultado);
    if (!info) return "";
    return `<span class="periodicidade-tag ${info.badgeClass}">${escapeHtmlText(info.label)}</span>`;
  }

  // Texto de análise a ser usado tanto no DOM (app) quanto no HTML exportado do relatório.
  function periodicidadeAlertText(resultado) {
    if (!resultado || !resultado.registros || !resultado.registros.length) return null;
    const ruins = resultado.registros.filter((r) => isSituacaoRuim(r.situacao));
    if (!ruins.length) return null;
    const info = periodicidadeInfo(resultado);
    const locais = resultado.nivel === "distrital" ? "" : ` em ${ruins.map((r) => r.local).join(", ")}`;
    if (info.cautela) {
      return {
        cls: "periodicidade-cautela",
        html: `⏳ <strong>${escapeHtmlText(info.label)}:</strong> resultado parcial abaixo da meta${escapeHtmlText(locais)}. Por ser um indicador de acompanhamento <u>anual</u>, este resultado ainda pode se recuperar até o fechamento de dezembro — não classificar como resultado ruim do ano nesta etapa, apenas sinalizar como ponto de atenção do período.`
      };
    }
    return {
      cls: "periodicidade-consolidado",
      html: `⚠️ <strong>${escapeHtmlText(info.label)}:</strong> resultado crítico já consolidado no período${escapeHtmlText(locais)}. Como o cálculo deste indicador é feito mês a mês / por quadrimestre (não acumulado), este número reflete o desempenho real do período — deve ser apontado como resultado ruim na análise, sem esperar o fechamento anual.`
    };
  }

  function buildPeriodicidadeAlertEl(resultado) {
    const info = periodicidadeAlertText(resultado);
    if (!info) return null;
    const div = document.createElement("div");
    div.className = "periodicidade-alert " + info.cls;
    div.innerHTML = info.html;
    return div;
  }

  function periodicidadeAlertHTML(resultado) {
    const info = periodicidadeAlertText(resultado);
    if (!info) return "";
    return `<div class="periodicidade-alert ${info.cls}" style="border:1.5px solid ${info.cls === "periodicidade-consolidado" ? "#C43F38" : "#F0BE1E"}; background:${info.cls === "periodicidade-consolidado" ? "#FBE3E0" : "#FBF0CE"}; color:${info.cls === "periodicidade-consolidado" ? "#C43F38" : "#5C4708"}; border-radius:4px; padding:10px 12px; margin:8px 0 4px; font-size:12px; line-height:1.5;">${info.html}</div>`;
  }

  function resultadoPeriodoLabel(resultado) {
    const info = periodicidadeInfo(resultado);
    if (!info) return "Resultado parcial 2026";
    if (info.classe.startsWith("quad")) return "Resultado do quadrimestre (consolidado)";
    if (info.classe.startsWith("anual")) return "Resultado parcial 2026 (acompanhamento anual)";
    return "Resultado parcial 2026";
  }

  // ---------- TENDÊNCIA (projeção 1º x 2º quadrimestre -> resultado anual) ----------
  // Extrapola linearmente a variação entre o 1º e o 2º quadrimestre para estimar o 3º e,
  // com isso, um resultado anual projetado — respondendo à pergunta "se continuar assim,
  // fecha o ano bem ou mal?". É uma projeção simples (linear), não estatística robusta:
  // serve para apontar direção e risco, não como valor definitivo.
  const TENDENCIA_MSG = {
    risco_queda: { icon: "📉", cls: "tend-alerta", texto: (t) =>
      `Atenção à tendência: o indicador atinge a meta no 2º quadrimestre, mas a trajetória entre o 1º (${fmtNum(t.q1)}) e o 2º quadrimestre (${fmtNum(t.q2)}) está piorando. Mantido esse ritmo, o resultado anual projetado (~${fmtNum(t.projecao_anual)}) pode não atingir a meta (${fmtNum(t.meta)}).` },
    tendencia_piora: { icon: "📉", cls: "tend-alerta", texto: (t) =>
      `Tendência de piora: o resultado já está abaixo da meta e a trajetória entre o 1º (${fmtNum(t.q1)}) e o 2º quadrimestre (${fmtNum(t.q2)}) está piorando. Mantido esse ritmo, o resultado anual projetado (~${fmtNum(t.projecao_anual)}) permanece abaixo da meta (${fmtNum(t.meta)}) — indício de resultado ruim consolidado no ano, não apenas oscilação pontual do período.` },
    estagnado_ruim: { icon: "⚠️", cls: "tend-alerta", texto: (t) =>
      `Resultado abaixo da meta e sem sinal de melhora entre o 1º (${fmtNum(t.q1)}) e o 2º quadrimestre (${fmtNum(t.q2)}). Na tendência atual, o resultado anual projetado (~${fmtNum(t.projecao_anual)}) continua abaixo da meta (${fmtNum(t.meta)}).` },
    recuperacao: { icon: "📈", cls: "tend-recuperacao", texto: (t) =>
      `Sinal de recuperação: o resultado ainda está abaixo da meta, mas a trajetória entre o 1º (${fmtNum(t.q1)}) e o 2º quadrimestre (${fmtNum(t.q2)}) melhora o suficiente para, se mantida, atingir a meta anual (projeção ~${fmtNum(t.projecao_anual)} vs. meta ${fmtNum(t.meta)}).` },
    ok: { icon: "✅", cls: "tend-ok", texto: (t) =>
      `Tendência estável ou favorável entre o 1º (${fmtNum(t.q1)}) e o 2º quadrimestre (${fmtNum(t.q2)}); projeção anual (~${fmtNum(t.projecao_anual)}) dentro da meta (${fmtNum(t.meta)}).` }
  };

  function buildTendenciaEl(tendencia, { compact } = {}) {
    if (!tendencia || !tendencia.alerta) return null;
    const spec = TENDENCIA_MSG[tendencia.alerta];
    if (!spec) return null;
    if (compact && (tendencia.alerta === "ok")) return null; // não poluir com estados neutros em listas compactas
    const div = document.createElement("div");
    div.className = "tendencia-box " + spec.cls;
    div.innerHTML = `<strong>${spec.icon} Tendência (1º→2º quad.):</strong> ${escapeHtml(spec.texto(tendencia))}`;
    return div;
  }

  function tendenciaHTML(tendencia) {
    if (!tendencia || !tendencia.alerta) return "";
    const spec = TENDENCIA_MSG[tendencia.alerta];
    if (!spec) return "";
    const bg = spec.cls === "tend-alerta" ? "#FBE3E0" : (spec.cls === "tend-recuperacao" ? "#FBF0CE" : "#E3E9F8");
    const border = spec.cls === "tend-alerta" ? "#C43F38" : (spec.cls === "tend-recuperacao" ? "#F0BE1E" : "#2A4B9B");
    const color = spec.cls === "tend-alerta" ? "#C43F38" : (spec.cls === "tend-recuperacao" ? "#5C4708" : "#1D356F");
    return `<div class="tendencia-box ${spec.cls}" style="border:1.5px solid ${border}; background:${bg}; color:${color}; border-radius:4px; padding:10px 12px; margin:8px 0 4px; font-size:12px; line-height:1.5;"><strong>${spec.icon} Tendência (1º→2º quad.):</strong> ${escapeHtmlText(spec.texto(tendencia))}</div>`;
  }

  // pega uma tendência representativa de um resultado: a pior entre os registros (prioriza alertas)
  // ou a tendência geral agregada quando não há registros individuais com tendência.
  const TENDENCIA_PRIORIDADE = ["tendencia_piora", "risco_queda", "estagnado_ruim", "recuperacao", "ok"];
  function pickWorstTendencia(resultado) {
    if (!resultado) return null;
    const candidatos = (resultado.registros || []).map((r) => r.tendencia).filter(Boolean);
    if (resultado.tendencia_geral) candidatos.push(resultado.tendencia_geral);
    if (!candidatos.length) return null;
    candidatos.sort((a, b) => TENDENCIA_PRIORIDADE.indexOf(a.alerta) - TENDENCIA_PRIORIDADE.indexOf(b.alerta));
    return candidatos[0];
  }

  function cardHasTendenciaAlerta(card) {
    const check = (resultado) => {
      const t = pickWorstTendencia(resultado);
      return t && (t.alerta === "tendencia_piora" || t.alerta === "risco_queda" || t.alerta === "estagnado_ruim");
    };
    if (check(card.resultado)) return true;
    return (card.edges || []).some((e) => check(e.resultado));
  }

  function buildResultBlock(resultado, localityFilter) {
    const wrap = document.createElement("div");
    wrap.className = "report-result-block";
    if (!resultado || !resultado.registros || !resultado.registros.length) {
      wrap.innerHTML = `<div class="report-noresult">Sem resultado localizado nos arquivos de monitoramento enviados.</div>`;
      return wrap;
    }
    if (resultado.nivel === "distrital") {
      const r = resultado.registros[0];
      wrap.innerHTML = `
        <div class="report-metric-row">
          <div class="report-metric"><span class="mlabel">Meta</span><span class="mvalue">${fmtNum(r.meta)}</span></div>
          <div class="report-metric"><span class="mlabel">${escapeHtml(resultadoPeriodoLabel(resultado))}</span><span class="mvalue">${fmtNum(r.resultado)}</span></div>
          <div class="report-metric"><span class="mlabel">Situação</span><span class="mvalue" style="color:${situacaoColor(r.situacao)}">${escapeHtml(r.situacao || "—")}</span></div>
        </div>
        ${r.area ? `<div class="report-area">Área responsável: ${escapeHtml(r.area)}</div>` : ""}
        ${periodicidadeTagHTML(resultado)}
      `;
      const alertEl = buildPeriodicidadeAlertEl(resultado);
      if (alertEl) wrap.appendChild(alertEl);
      const trendEl = buildTendenciaEl(pickWorstTendencia(resultado));
      if (trendEl) wrap.appendChild(trendEl);
    } else {
      let registros = resultado.registros;
      if (localityFilter && localityFilter !== "__all__") {
        registros = registros.filter(r => String(r.local) === localityFilter);
        if (!registros.length) {
          wrap.innerHTML = `<div class="report-noresult">Sem registro para "${escapeHtml(localityFilter)}" neste indicador.</div>`;
          return wrap;
        }
      }
      const rows = registros.map((r) => `
        <tr${localityFilter && String(r.local) === localityFilter ? ' class="row-highlight"' : ''}>
          <td>${escapeHtml(String(r.local || "—"))}</td>
          <td>${fmtNum(r.meta)}</td>
          <td>${fmtNum(r.resultado)}</td>
          <td style="color:${situacaoColor(r.situacao)}; font-weight:600;">${escapeHtml(r.situacao || "—")}</td>
        </tr>
      `).join("");
      const nAtingiu = registros.filter(r => (r.situacao || "").includes("Atingiu")).length;
      const periodoTxt = resultadoPeriodoLabel(resultado);
      const summaryText = localityFilter && localityFilter !== "__all__"
        ? `Mostrando: ${escapeHtml(localityFilter)}`
        : `${nAtingiu} de ${registros.length} localidades atingiram a meta · ${escapeHtml(periodoTxt)}`;
      wrap.innerHTML = `
        <div class="report-summary">${summaryText}</div>
        ${periodicidadeTagHTML(resultado)}
        <table class="report-table">
          <thead><tr><th>Local</th><th>Meta</th><th>Resultado</th><th>Situação</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
      const alertEl = buildPeriodicidadeAlertEl(resultado);
      if (alertEl) wrap.appendChild(alertEl);
      const trendEl = buildTendenciaEl(pickWorstTendencia(resultado));
      if (trendEl) wrap.appendChild(trendEl);
    }
    return wrap;
  }

  function collectLocalities(card, edge) {
    const set = new Set();
    [card.resultado, edge.resultado].forEach((res) => {
      if (res && res.nivel === "regional") {
        res.registros.forEach((r) => { if (r.local) set.add(String(r.local)); });
      }
    });
    return Array.from(set).sort();
  }

  function buildReportIndicatorCard(label, nome, instr, resultado, localityFilter) {
    const box = document.createElement("div");
    box.className = "report-indic-box";
    box.dataset.role = label === "Indicador central" ? "central" : "partner";
    const h = document.createElement("div");
    h.className = "report-indic-label";
    h.textContent = label;
    box.appendChild(h);
    const n = document.createElement("div");
    n.className = "report-indic-name";
    n.textContent = nome;
    box.appendChild(n);
    const tag = document.createElement("span");
    tag.className = "badge-instr";
    tag.style.marginBottom = "10px";
    tag.style.display = "inline-block";
    tag.textContent = instr;
    box.appendChild(tag);
    const resultBlock = buildResultBlock(resultado, localityFilter);
    resultBlock.classList.add("result-block-slot");
    box.appendChild(resultBlock);
    return box;
  }

  function escapeHtmlText(s) {
    const d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function resultadoToHTML(resultado, localityFilter) {
    if (!resultado || !resultado.registros || !resultado.registros.length) {
      return `<p style="font-style:italic;color:#8A7F6A;">Sem resultado localizado nos arquivos de monitoramento enviados.</p>`;
    }
    if (resultado.nivel === "distrital") {
      const r = resultado.registros[0];
      return `
        <table class="rpt-table">
          <tr><th>Meta</th><th>${escapeHtmlText(resultadoPeriodoLabel(resultado))}</th><th>Situação</th></tr>
          <tr><td>${fmtNum(r.meta)}</td><td>${fmtNum(r.resultado)}</td><td>${escapeHtmlText(r.situacao || "—")}</td></tr>
        </table>
        ${r.area ? `<p style="font-size:12px;color:#4A4238;">Área responsável: ${escapeHtmlText(r.area)}</p>` : ""}
        ${periodicidadeTagHTML(resultado)}
        ${periodicidadeAlertHTML(resultado)}
        ${tendenciaHTML(pickWorstTendencia(resultado))}
      `;
    }
    let registros = resultado.registros;
    if (localityFilter && localityFilter !== "__all__") {
      registros = registros.filter(r => String(r.local) === localityFilter);
    }
    const rows = registros.map(r => `
      <tr>
        <td>${escapeHtmlText(r.local)}</td>
        <td>${fmtNum(r.meta)}</td>
        <td>${fmtNum(r.resultado)}</td>
        <td>${escapeHtmlText(r.situacao || "—")}</td>
      </tr>
    `).join("");
    const nAtingiu = registros.filter(r => (r.situacao || "").includes("Atingiu")).length;
    const periodoTxt = resultadoPeriodoLabel(resultado);
    return `
      <p style="font-size:12px; font-weight:600;">${nAtingiu} de ${registros.length} localidades atingiram a meta · ${escapeHtmlText(periodoTxt)}${localityFilter && localityFilter !== "__all__" ? " (filtrado: " + escapeHtmlText(localityFilter) + ")" : ""}</p>
      ${periodicidadeTagHTML(resultado)}
      <table class="rpt-table">
        <tr><th>Local</th><th>Meta</th><th>Resultado</th><th>Situação</th></tr>
        ${rows}
      </table>
      ${periodicidadeAlertHTML(resultado)}
      ${tendenciaHTML(pickWorstTendencia(resultado))}
    `;
  }

  function downloadReportHTML(card, edge, localityFilter) {
    const html = `<!DOCTYPE html>

  .periodicidade-tag.pt-quad { background:#E3E9F8; color:#1D356F; border:1px solid #2A4B9B; }
  .periodicidade-tag.pt-anual { background:#FBF0CE; color:#8A6A0C; border:1px solid #F0BE1E; }

</style></head>
<body>
  <div class="kicker">Relatório Detalhado dos Indicadores</div>
  <h1>${escapeHtmlText(card.nome)}</h1>
  <div class="tipo-tag">${escapeHtmlText(tipoLabel(edge.tipo))}</div>

  <div class="box">
    <div class="label">Indicador central</div>
    <div class="instr-badge">${escapeHtmlText(card.instrumento)}</div>
    <h2>${escapeHtmlText(card.nome)}</h2>
    ${resultadoToHTML(card.resultado, localityFilter)}
  </div>

  <div class="box">
    <div class="label">Indicador correlato</div>
    <div class="instr-badge">${escapeHtmlText(edge.partner_instr)}</div>
    <h2>${escapeHtmlText(edge.partner_nome)}</h2>
    ${resultadoToHTML(edge.resultado, localityFilter)}
  </div>

  <div class="analysis">
    <div class="label">Análise da correlação</div>
    <p>${escapeHtmlText(edge.razao || "(sem análise registrada)")}</p>
    ${edge.shared_terms && edge.shared_terms.length ? `<p style="font-family:Arial,sans-serif;font-size:11px;font-style:normal;">Termos em comum: ${edge.shared_terms.map(escapeHtmlText).join(", ")}</p>` : ""}
  </div>

  <div class="footer-note">Gerado em ${new Date().toLocaleString("pt-BR")} — Instrumento de Monitoramento · DIMOAS · Sistema de Apoio e Logístico</div>
</body></html>`;

    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const safeName = card.nome.replace(/[^\w\-]+/g, "_").slice(0, 50);
    a.download = `relatorio_${safeName}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function openReport(card, edge) {
    const overlay = document.createElement("div");
    overlay.className = "report-overlay";
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeReport(); });

    const modal = document.createElement("div");
    modal.className = "report-modal";

    const header = document.createElement("div");
    header.className = "report-header";
    header.innerHTML = `
      <div>
        <div class="report-kicker">Relatório Detalhado dos Indicadores</div>
        <div class="report-tipo-tag ${tipoClass(edge.tipo)}">${tipoLabel(edge.tipo)}</div>
      </div>
      <button class="report-close" id="reportCloseBtn">✕</button>
    `;
    modal.appendChild(header);

    const body = document.createElement("div");
    body.className = "report-body";

    const localities = collectLocalities(card, edge);
    let currentLocality = "__all__";

    if (localities.length) {
      const filterBar = document.createElement("div");
      filterBar.className = "report-locality-bar";
      const label = document.createElement("label");
      label.textContent = "Filtrar por localidade:";
      label.setAttribute("for", "localitySelect");
      const select = document.createElement("select");
      select.id = "localitySelect";
      select.className = "tipo-select";
      const optAll = document.createElement("option");
      optAll.value = "__all__";
      optAll.textContent = "TODAS AS LOCALIDADES";
      select.appendChild(optAll);
      localities.forEach((loc) => {
        const o = document.createElement("option");
        o.value = loc;
        o.textContent = loc.toUpperCase();
        select.appendChild(o);
      });
      select.addEventListener("change", (e) => {
        currentLocality = e.target.value;
        refreshGrid();
      });
      filterBar.appendChild(label);
      filterBar.appendChild(select);
      body.appendChild(filterBar);
    }

    const grid = document.createElement("div");
    grid.className = "report-grid";
    body.appendChild(grid);

    function refreshGrid() {
      grid.innerHTML = "";
      grid.appendChild(buildReportIndicatorCard("Indicador central", card.nome, card.instrumento, card.resultado, currentLocality));
      grid.appendChild(buildReportIndicatorCard("Indicador correlato", edge.partner_nome, edge.partner_instr, edge.resultado, currentLocality));
    }
    refreshGrid();

    const analysisBox = document.createElement("div");
    analysisBox.className = "report-analysis";
    analysisBox.innerHTML = `<div class="report-indic-label">Análise da correlação</div>`;
    const analysisText = document.createElement("div");
    analysisText.className = "report-analysis-text";
    analysisText.textContent = edge.razao || "(sem análise registrada ainda — edite o campo de justificativa na ficha para que ela apareça aqui.)";
    analysisBox.appendChild(analysisText);
    if (edge.shared_terms && edge.shared_terms.length) {
      const chips = document.createElement("div");
      chips.className = "shared-terms";
      chips.style.marginTop = "12px";
      edge.shared_terms.forEach((t) => {
        const chip = document.createElement("span");
        chip.className = "term-chip";
        chip.textContent = t;
        chips.appendChild(chip);
      });
      analysisBox.appendChild(chips);
    }
    body.appendChild(analysisBox);

    modal.appendChild(body);

    const footer = document.createElement("div");
    footer.className = "report-footer";
    const downloadBtn = document.createElement("button");
    downloadBtn.className = "btn";
    downloadBtn.textContent = "⬇ Baixar Relatório (HTML)";
    downloadBtn.addEventListener("click", () => downloadReportHTML(card, edge, currentLocality));
    footer.appendChild(downloadBtn);
    const printBtn = document.createElement("button");
    printBtn.className = "btn";
    printBtn.textContent = "Imprimir";
    printBtn.addEventListener("click", () => window.print());
    footer.appendChild(printBtn);
    modal.appendChild(footer);

    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    document.getElementById("reportCloseBtn").addEventListener("click", closeReport);
    document.addEventListener("keydown", escCloseHandler);
  }

  function escCloseHandler(e) {
    if (e.key === "Escape") closeReport();
  }
  function closeReport() {
    const overlay = document.querySelector(".report-overlay");
    if (overlay) overlay.remove();
    document.removeEventListener("keydown", escCloseHandler);
  }

  // ---------- DEBOUNCED SAVE ----------
  let saveTimer = null;
  function saveStateDebounced() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveState, 500);
  }

  // ---------- EXPORT / RESET ----------
  function exportJSON() {
    const blob = new Blob([JSON.stringify(cards, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "SAL_convergencias_editado.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function resetAll() {
    if (!confirm("Isso vai apagar todas as suas edições (desta rede) e voltar ao conteúdo original. Os instrumentos de planejamento anexados por unidade não são afetados. Continuar?")) return;
    await storageDelete(storageKey("cards"), true);
    await storageDelete(storageKey("lacunas"), true);
    cards = JSON.parse(JSON.stringify(originalCards));
    lacunas = JSON.parse(JSON.stringify(originalLacunas));
    buildFlatList();
    buildFlatLacunaList();
    activeIndex = flatList.length ? 0 : -1;
    activeLacunaIndex = flatLacunaList.length ? 0 : -1;
    renderSidebar(document.getElementById("searchInput").value);
    if (currentView === "convergencias") renderContent(); else renderLacunaContent();
  }

  // ---------- INIT ----------
  function setLoadingOverlay(show, msg) {
    let el = document.getElementById("loadingOverlay");
    if (!el) {
      el = document.createElement("div");
      el.id = "loadingOverlay";
      el.className = "loading-overlay";
      document.body.appendChild(el);
    }
    el.textContent = msg || "Carregando dados salvos…";
    el.style.display = show ? "flex" : "none";
  }

  async function loadNetworkData() {
    setLoadingOverlay(true, "Carregando dados salvos desta rede…");
    await loadState();
    buildFlatList();
    await loadLacunasState();
    buildFlatLacunaList();
    await refreshPlanKeysCache();
    activeIndex = flatList.length ? 0 : -1;
    activeLacunaIndex = flatLacunaList.length ? 0 : -1;

    document.getElementById("countConv").textContent = flatList.length;
    document.getElementById("countLac").textContent = flatLacunaList.length;

    renderSidebar(document.getElementById("searchInput").value);
    if (currentView === "convergencias") renderContent(); else renderLacunaContent();
    setLoadingOverlay(false);
  }

  async function switchNetwork(net) {
    if (net === currentNetwork) return;
    const available = window.NETWORK_DATA && window.NETWORK_DATA[net];
    if (!available) {
      alert("Esta rede ainda não foi carregada neste site.");
      document.getElementById("networkSelect").value = currentNetwork;
      return;
    }
    currentNetwork = net;
    document.getElementById("searchInput").value = "";
    await loadNetworkData();
  }

  async function init() {
    setLoadingOverlay(true, "Carregando…");
    const noteEl = document.getElementById("sharedNote");
    if (STORAGE_BACKEND === "artifact") {
      noteEl.textContent = "🔗 Link compartilhado — edições são visíveis a todos";
      noteEl.title = "Os dados deste site (edições de texto e anexos) ficam salvos no servidor e são visíveis e editáveis por qualquer pessoa que abra este link.";
    } else {
      noteEl.textContent = "💾 Edições salvas só neste navegador";
      noteEl.title = "As edições de texto e os anexos ficam salvos apenas no armazenamento local deste navegador/computador — não são vistos por outras pessoas que abrirem este mesmo site em outro lugar.";
    }
    await loadState();
    buildFlatList();
    await loadLacunasState();
    buildFlatLacunaList();
    await refreshPlanKeysCache();

    document.getElementById("countConv").textContent = flatList.length;
    document.getElementById("countLac").textContent = flatLacunaList.length;

    renderSidebar("");
    if (flatList.length) selectCard(0);
    setLoadingOverlay(false);

    document.getElementById("searchInput").addEventListener("input", (e) => {
      renderSidebar(e.target.value);
    });
    document.getElementById("exportBtn").addEventListener("click", exportJSON);
    document.getElementById("resetBtn").addEventListener("click", resetAll);

    document.getElementById("tabConvergencias").addEventListener("click", () => switchView("convergencias"));
    document.getElementById("tabLacunas").addEventListener("click", () => switchView("lacunas"));

    const netSelect = document.getElementById("networkSelect");
    Object.keys(NETWORK_LABELS).forEach((code) => {
      const opt = netSelect.querySelector(`option[value="${code}"]`);
      if (opt) {
        const hasData = window.NETWORK_DATA && window.NETWORK_DATA[code];
        opt.disabled = !hasData;
        opt.textContent = hasData
          ? `${NETWORK_LABELS[code]}${code !== "SAL" ? "" : ""}`
          : `${NETWORK_LABELS[code]} — em breve`;
      }
    });
    netSelect.value = currentNetwork;
    netSelect.addEventListener("change", (e) => switchNetwork(e.target.value));
  }

  function switchView(view) {
    if (view === currentView) return;
    currentView = view;
    document.getElementById("tabConvergencias").classList.toggle("active", view === "convergencias");
    document.getElementById("tabLacunas").classList.toggle("active", view === "lacunas");
    document.getElementById("searchInput").value = "";
    document.getElementById("searchInput").placeholder = view === "lacunas" ? "Buscar lacuna…" : "Buscar no arquivo…";
    renderSidebar("");
    if (view === "convergencias") {
      if (activeIndex < 0 && flatList.length) activeIndex = 0;
      renderContent();
    } else {
      if (activeLacunaIndex < 0 && flatLacunaList.length) activeLacunaIndex = 0;
      renderLacunaContent();
    }
    document.getElementById("content").scrollTop = 0;
    renderSidebar("");
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
</html>
